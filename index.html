<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML += '<pre id="err" style="color:red;white-space:pre-wrap;z-index:999999;position:relative;">' + msg + '\n' + url + ':' + line + '\n' + (error ? error.stack : '') + '</pre>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<pre id="err" style="color:red;white-space:pre-wrap;z-index:999999;position:relative;">' + (event.reason ? event.reason.stack : event.reason) + '</pre>';
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zia Jauhari Juanda — Software Engineer &amp; Web Developer</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #080808;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

</html>
